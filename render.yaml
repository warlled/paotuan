services:
  - type: web
    name: paotuan
    runtime: docker
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MODEL_NAME
        value: deepseek-chat
      - key: SHARE_KEY
        value: gmv1f7
      - key: GUEST_TURN_LIMIT
        value: "800"
      - key: GUEST_DAILY_CALLS
        value: "200"
      - key: GUEST_HARD_DAILY_CALLS
        value: "1200"
      - key: MAX_CONCURRENT_MODELS
        value: "4"
      - key: DATA_DIR
        value: /data
      - key: SITE_DEFAULT_OPEN
        value: "1"
      - key: BIND_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HEADERS
        value: "1"
