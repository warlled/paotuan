services:
  - type: web
    name: paotuan
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/ping
    envVars:
      - key: MODEL_PROVIDER
        value: deepseek
      - key: MODEL_NAME
        value: deepseek-chat
      - key: BIND_HOST
        value: 0.0.0.0
      - key: GUEST_TURN_LIMIT
        value: "800"
      - key: GUEST_DAILY_CALLS
        value: "0"
      - key: MAX_CONCURRENT_MODELS
        value: "4"
      - key: SHARE_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
