<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#fbf7f1">
<title>我的私人空间</title>
<link rel="stylesheet" href="/bottom-nav.css?v=20261127-navpages1">
<style>
  :root { --bg:#0d0f15; --panel:#151823; --line:#262b3a; --text:#e7e8ee; --muted:#8b90a0; --accent:#c8a06a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:15px/1.7 "Microsoft YaHei",system-ui,sans-serif; padding:28px 18px 112px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .top h1 { font-size:18px; margin:0; letter-spacing:2px; }
  .top-links { display:flex; align-items:center; gap:10px; margin-left:auto; }
  .top a { color:var(--accent); text-decoration:none; font-size:13px; white-space:nowrap; }
  .grid { display:grid; grid-template-columns: 320px 1fr; gap:16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .profile-head { display:grid; grid-template-columns:88px minmax(0,1fr); gap:13px; align-items:center; }
  .avatar { width:88px; height:88px; border-radius:50%; background:#10131b; border:1px solid var(--line); overflow:hidden; display:grid; place-items:center; position:relative; cursor:pointer; }
  .avatar:hover { border-color:var(--accent); }
  .avatar:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:none; }
  .avatar img.on { display:block; }
  .avatar span { position:absolute; color:var(--muted); font-size:12px; }
  .avatar img.on + span { display:none; }
  .name { font-size:18px; font-weight:600; }
  .bio { color:var(--muted); font-size:13px; margin:4px 0 0; min-height:20px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, textarea, select { width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--line); background:#10131b; color:var(--text); font:inherit; outline:none; }
  input:focus, textarea:focus, select:focus { border-color:var(--accent); }
  textarea { resize:vertical; }
  .color-row { display:flex; align-items:center; gap:10px; }
  .color-row .hint { line-height:1.4; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .social-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; padding-top:11px; border-top:1px dashed #262b3a; }
  .social-actions button { padding:6px 10px; font-size:12px; }
  button.primary { background:var(--accent); color:#1a1408; border:0; border-radius:9px; padding:8px 18px; font-weight:600; cursor:pointer; }
  .file { border:1px solid var(--line); border-radius:9px; padding:6px 12px; font-size:12.5px; color:var(--muted); cursor:pointer; }
  .hint { color:var(--muted); font-size:12px; }
  h2 { font-size:14px; letter-spacing:2px; color:var(--accent); margin:0 0 10px; }
  .notes { min-height:120px; }
  .posts { display:grid; gap:10px; }
  .post { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#12151e; }
  .post .t { font-size:14px; font-weight:600; }
  .post .m { color:var(--muted); font-size:11.5px; margin-left:8px; }
  .post p { margin:4px 0 0; font-size:13.5px; white-space:pre-wrap; word-break:break-word; }
  .post img, .post video { max-width:100%; max-height:220px; border-radius:10px; margin-top:8px; display:block; }
  .empty { color:var(--muted); font-size:13px; padding:10px; text-align:center; }
  .scn { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:6px 10px; }
  .scn .t { flex:1; font-size:13px; }
  .scn .m { color:var(--muted); font-size:11.5px; }
  .scn button {
    background:transparent; border:1px solid var(--line); border-radius:7px;
    padding:3px 9px; font-size:11.5px; color:var(--muted); cursor:pointer;
  }
  @media (max-width: 640px) {
    body { padding: 14px 10px calc(36px + env(safe-area-inset-bottom)); }
    .top { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-bottom: 14px; }
    .top h1 { grid-column:1; grid-row:1; font-size: 17px; }
    .top-links { grid-column:2; grid-row:1; margin-left:0; gap:6px; }
    .top a { margin-left: 0 !important; min-height: 44px; padding:0 10px; display: inline-flex; align-items: center; justify-content:center; border:1px solid var(--line); border-radius:9px; }
    .top select { grid-column:1 / -1; grid-row:2; width:100% !important; min-width: 0 !important; min-height: 44px; }
    .card { padding: 14px; border-radius: 14px; }
    input, textarea, select { min-height: 44px; font-size: 16px; background:#10131b; color:var(--text); }
    label { color: color-mix(in srgb, var(--muted) 72%, var(--text)); font-size: 12.5px; }
    textarea { resize:none; }
    .profile-head { grid-template-columns:72px minmax(0,1fr); gap:11px; }
    .name { font-size:17px; }
    #in-theme { width:44px !important; height:44px !important; }
    .row button, .row .file { min-height: 44px; }
    #owner-tools > .row:first-of-type .file { display:none; }
    #owner-tools > .row:first-of-type .primary,
    #notes-card .row .primary { width:100%; }
    #owner-tools .row .file,
    #owner-tools .row .primary { flex: 1 1 100%; text-align: center; }
    .avatar { width: 72px; height: 72px; }
    .post { padding: 11px; }
    .post p { font-size: 14px; line-height: 1.7; }
    .scn { flex-wrap: wrap; }
    .scn .t { flex: 1 1 100%; }
    .scn button { min-height: 36px; padding: 5px 12px; }
  }
  @media (pointer: coarse) {
    .top select, .top a, input, textarea, button.primary, .file, .scn button { min-height: 42px; }
    #in-theme { min-height: 42px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>我的私人空间</h1>
    <select data-language-select style="width:auto;min-width:112px;padding:5px 8px">
      <option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option>
      <option value="en">English</option><option value="ja">日本語</option>
      <option value="ko">한국어</option><option value="de">Deutsch</option>
      <option value="fr">Français</option><option value="ru">Русский</option>
    </select>
    <div class="top-links">
      <a id="public-link" href="#" target="_blank" rel="noopener" style="display:none">我的公开主页</a>
      <a href="/">← 回到游戏</a>
    </div>
  </div>
  <div class="grid">
    <div>
      <div class="card profile-card">
        <div class="profile-head">
          <div class="avatar" id="avatar-picker" role="button" tabindex="0" title="点击更换头像">
            <img id="avatar" alt="">
            <span>头像</span>
          </div>
          <div class="profile-copy">
            <div class="name" id="name">匿名旅人</div>
            <div class="bio" id="bio"></div>
          </div>
        </div>
        <div id="owner-tools">
          <label>昵称</label>
          <input id="in-name" maxlength="20" placeholder="唯一昵称">
          <label>个人简介</label>
          <input id="in-bio" maxlength="200" placeholder="一句话介绍自己">
          <label>主题色</label>
          <div class="color-row">
            <input id="in-theme" type="color" value="#c8a06a" style="width:52px;height:30px;padding:0">
            <span class="hint">点击色块更换主题色</span>
          </div>
          <div class="row">
            <label class="file">上传头像<input id="in-avatar" type="file" accept="image/*" hidden></label>
            <button class="primary" id="save">保存资料</button>
          </div>
          <div class="hint" id="status" style="margin-top:8px"></div>
        </div>
        <div id="public-account-actions" class="social-actions hidden">
          <button id="public-follow" class="ghost" type="button">关注</button>
          <button id="public-friend" class="ghost" type="button">加好友</button>
          <button id="public-message" class="ghost" type="button">私信</button>
          <button id="public-block" class="ghost" type="button">拉黑</button>
          <button id="public-report" class="ghost" type="button">举报</button>
          <span id="public-social-status" class="hint"></span>
        </div>
      </div>
      <div class="card" id="notes-card" style="margin-top:16px">
        <h2>私人笔记</h2>
        <textarea id="notes" class="notes" maxlength="2000" placeholder="只有你自己能看到的内容"></textarea>
        <div class="row">
          <button class="primary" id="save-notes">保存笔记</button>
          <span class="hint" id="notes-status"></span>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>我的作品</h2>
      <div id="posts" class="posts"><div class="empty">还没有发布过作品</div></div>
      <div class="card" id="scenarios-card" style="margin-top:16px; padding:12px">
        <h2>我的剧本</h2>
        <div id="my-scenarios" class="posts"><div class="empty">还没有创作剧本</div></div>
      </div>
    </div>
  </div>
</div>
<script src="/bottom-nav.js?v=20261127-navpages1"></script>
<script src="/i18n.js?v=20261127-privacy1"></script>
<script>
const $ = (id) => document.getElementById(id);
let me = null;
let avatarUrl = "";
let publicProfileData = null;

function applyTheme(color) {
  if (/^#[0-9a-f]{6}$/i.test(color || "")) document.documentElement.style.setProperty("--accent", color);
}

async function load() {
  const r = await fetch("/api/me");
  me = await r.json();
  avatarUrl = me.avatar || "";
  $("in-name").value = me.name || "";
  $("in-bio").value = me.bio || "";
  $("in-theme").value = me.theme || "#c8a06a";
  $("notes").value = me.notes || "";
  $("name").textContent = me.name || "匿名旅人";
  $("bio").textContent = me.bio || "";
  if (avatarUrl) { $("avatar").src = avatarUrl; $("avatar").classList.add("on"); }
  applyTheme(me.theme);
  const posts = await (await fetch("/api/community?mine=1")).json();
  render(posts.posts || []);
  $("public-link").href = "/space?u=" + encodeURIComponent(me.pid || "");
  $("public-link").style.display = me.pid ? "inline" : "none";
  const mine = await (await fetch("/api/my-scenarios")).json();
  renderScenarios(mine.scenarios || []);
}

function renderScenarios(list) {
  const box = $("my-scenarios");
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = '<div class="empty">还没有创作剧本</div>';
    return;
  }
  for (const s of list) {
    const row = document.createElement("div");
    row.className = "scn";
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = s.title;
    const m = document.createElement("span");
    m.className = "m";
    m.textContent = s.genre || "";
    const btn = document.createElement("button");
    btn.textContent = "分享到社区";
    btn.addEventListener("click", async () => {
      const r = await fetch("/api/scenario/share", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: s.id }),
      });
      const data = await r.json();
      alert(r.ok ? "已分享到创作社区。" : data.error || "分享失败");
    });
    row.append(t, m, btn);
    box.appendChild(row);
  }
}

async function loadPublic(pid) {
  document.getElementById("owner-tools").style.display = "none";
  document.getElementById("notes-card").style.display = "none";
  document.getElementById("scenarios-card").style.display = "none";
  document.getElementById("public-link").style.display = "none";
  const r = await fetch("/api/player?pid=" + encodeURIComponent(pid));
  if (!r.ok) {
    document.querySelector(".top h1").textContent = "找不到这位玩家";
    return;
  }
  const p = await r.json();
  publicProfileData = p;
  document.querySelector(".top h1").textContent = (p.name || "匿名旅人") + " 的空间";
  $("name").textContent = p.name || "匿名旅人";
  $("bio").textContent = p.bio || "";
  if (p.avatar) {
    $("avatar").src = p.avatar;
    $("avatar").classList.add("on");
  }
  render(p.posts || []);
  renderPublicAccountActions(p);
}

function renderPublicAccountActions(profile) {
  const box = $("public-account-actions");
  if (!profile?.accountRegistered || profile.isSelf) {
    box.classList.add("hidden");
    return;
  }
  box.classList.remove("hidden");
  const relation = profile.relation || {};
  $("public-follow").textContent = relation.following ? "取消关注" : "关注";
  $("public-friend").textContent = relation.friend
    ? "已是好友"
    : relation.outgoingRequest
      ? "好友请求已发送"
      : relation.incomingRequest
        ? "接受好友请求"
        : "加好友";
  $("public-message").classList.toggle("hidden", !relation.friend);
  $("public-block").textContent = relation.blockedByMe ? "解除拉黑" : "拉黑";
  $("public-social-status").textContent = profile.loggedIn ? "" : "登录账号后可以使用社交功能";
}

async function publicSocialAction(path, payload) {
  if (!publicProfileData?.loggedIn) {
    alert("请先在“我的 → 注册 / 登录”中登录账号。");
    return null;
  }
  const response = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await response.json();
  if (!response.ok) {
    alert(data.error || "操作失败");
    return null;
  }
  return data;
}

$("public-follow").addEventListener("click", async () => {
  const following = !publicProfileData?.relation?.following;
  const data = await publicSocialAction("/api/account/follow", {
    pid: publicProfileData.pid,
    action: following ? "follow" : "unfollow",
  });
  if (!data) return;
  publicProfileData.relation = data.relation;
  renderPublicAccountActions(publicProfileData);
});

$("public-friend").addEventListener("click", async () => {
  const relation = publicProfileData?.relation || {};
  if (relation.friend) return;
  if (relation.incomingRequest) {
    const data = await publicSocialAction("/api/account/friend/respond", {
      requestId: relation.incomingRequest.id,
      accept: true,
    });
    if (!data) return;
    publicProfileData.relation.friend = true;
    publicProfileData.relation.incomingRequest = null;
  } else {
    const data = await publicSocialAction("/api/account/friend/request", { pid: publicProfileData.pid });
    if (!data) return;
    publicProfileData.relation = data.relation;
  }
  renderPublicAccountActions(publicProfileData);
});

$("public-message").addEventListener("click", async () => {
  if (!publicProfileData?.relation?.friend) return;
  const text = prompt("输入私信内容：");
  if (!text?.trim()) return;
  const data = await publicSocialAction("/api/account/messages/send", {
    pid: publicProfileData.pid,
    text: text.trim(),
  });
  if (data) $("public-social-status").textContent = "私信已发送";
});

$("public-block").addEventListener("click", async () => {
  const blocked = !publicProfileData?.relation?.blockedByMe;
  if (blocked && !confirm("拉黑后将解除关注和好友关系，并阻止私信。继续吗？")) return;
  const data = await publicSocialAction("/api/account/block", {
    pid: publicProfileData.pid,
    blocked,
  });
  if (!data) return;
  publicProfileData.relation = data.relation;
  renderPublicAccountActions(publicProfileData);
});

$("public-report").addEventListener("click", async () => {
  const choice = prompt("举报原因：\n1 骚扰\n2 仇恨\n3 垃圾广告\n4 色情\n5 暴力\n6 隐私\n7 冒充\n8 其他", "1");
  if (!choice) return;
  const reasons = { 1: "harassment", 2: "hate", 3: "spam", 4: "sexual", 5: "violence", 6: "privacy", 7: "impersonation", 8: "other" };
  const detail = prompt("补充说明（可不填，最多 500 字）：", "") || "";
  const data = await publicSocialAction("/api/account/report", {
    pid: publicProfileData.pid,
    reason: reasons[choice] || "other",
    detail,
  });
  if (data) $("public-social-status").textContent = "举报已提交，请等待管理员处理";
});

function render(posts) {
  const box = $("posts");
  box.innerHTML = "";
  if (!posts.length) {
    box.innerHTML = '<div class="empty">还没有发布过作品</div>';
    return;
  }
  for (const p of posts) {
    const el = document.createElement("div");
    el.className = "post";
    const head = document.createElement("div");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = p.title || "（无标题）";
    const m = document.createElement("span");
    m.className = "m";
    m.textContent = "♥ " + (p.likes || 0);
    head.append(t, m);
    el.appendChild(head);
    if (p.text) {
      const txt = document.createElement("p");
      txt.textContent = p.text;
      el.appendChild(txt);
    }
    if (p.media && p.media.url) {
      if (String(p.media.type || "").startsWith("video/")) {
        const v = document.createElement("video");
        v.src = p.media.url;
        v.controls = true;
        el.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.src = p.media.url;
        el.appendChild(img);
      }
    }
    box.appendChild(el);
  }
}

$("save").addEventListener("click", async () => {
  $("status").textContent = "保存中…";
  const r = await fetch("/api/me", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      name: $("in-name").value,
      bio: $("in-bio").value,
      theme: $("in-theme").value,
      avatar: avatarUrl,
      notes: $("notes").value,
    }),
  });
  const data = await r.json();
  if (!r.ok) { $("status").textContent = data.error || "保存失败"; return; }
  me = data;
  $("name").textContent = me.name || "匿名旅人";
  $("bio").textContent = me.bio || "";
  applyTheme(me.theme);
  $("status").textContent = "已保存";
});

$("save-notes").addEventListener("click", async () => {
  $("notes-status").textContent = "保存中…";
  const r = await fetch("/api/me", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      name: $("in-name").value,
      bio: $("in-bio").value,
      theme: $("in-theme").value,
      avatar: avatarUrl,
      notes: $("notes").value,
    }),
  });
  $("notes-status").textContent = r.ok ? "笔记已保存" : "保存失败";
});

function pickAvatar() {
  if ($("owner-tools").style.display === "none") return;
  $("in-avatar").click();
}
$("avatar-picker").addEventListener("click", pickAvatar);
$("avatar-picker").addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    pickAvatar();
  }
});

$("in-avatar").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { $("status").textContent = "头像不能超过 2MB"; return; }
  const dataUrl = await new Promise((resolve) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.readAsDataURL(file);
  });
  const r = await fetch("/api/upload", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ data: dataUrl, mime: file.type, avatar: true }),
  });
  const data = await r.json();
  if (!r.ok) { $("status").textContent = data.error || "上传失败"; return; }
  avatarUrl = data.url;
  $("avatar").src = data.url;
  $("avatar").classList.add("on");
  $("status").textContent = "头像已上传，记得保存资料";
});

const publicPid = new URLSearchParams(location.search).get("u");
if (publicPid) loadPublic(publicPid);
else load();
</script>
</body>
</html>
